spring.application.name=backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/secureasset
spring.datasource.username=secureasset
spring.datasource.password=secureasset_dev
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info,flyway

# Spring AI Gemini
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.6-flash

# Bounded retry configurations
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1000
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=5000
spring.ai.retry.exclude-on-http-codes=400,401,403

# Timeout configuration (finite timeout)
spring.ai.google.genai.chat.options.timeout=15s
razorpay.webhook.secret=test_secret
